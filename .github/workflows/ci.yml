name: LeetCode Practice CI

on:
  push:
    branches: [ main ]
    paths:
      - 'problems/**' # 只有當 problems/ 資料夾下的檔案有變動時才觸發 CI
  pull_request:
    branches: [ main ]
    paths:
      - 'problems/**'
      - '.github/workflows/**' # 新增這行：改 CI 設定檔時也會觸發

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Pytest Across All Problems
        run: |
          # 自動搜尋 problems/ 目錄下的所有 test_*.py 並執行測試
          pytest problems/